<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAPPORO SNOW FESTIVAL 3D — Project PLATEAU Edition</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #070b14;
      --card: #111827;
      --card-border: rgba(148, 163, 184, 0.2);
      --border: rgba(148, 163, 184, 0.28);
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #082f49;
      --secondary: #1e293b;
      --secondary-foreground: #e2e8f0;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    canvas { display: block; touch-action: none; }
    .cinema-bar { transition: height 320ms cubic-bezier(.22,1,.36,1); }
    .ctrl-btn { transition: background-color 140ms ease, color 140ms ease, transform 90ms ease; cursor: pointer; }
    .ctrl-btn:hover { filter: brightness(1.12); }
    .ctrl-btn:active { transform: scale(0.96); }
    @keyframes recPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .rec-dot { animation: recPulse 1s infinite; }
  </style>
</head>
<body class="antialiased select-none h-full">
  <div class="h-full max-w-[1440px] mx-auto px-3 py-2.5 flex flex-col gap-2">
    <!-- Top Scene Selector & PLATEAU Mode Bar -->
    <div class="shrink-0 flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)] text-xs">
      <div class="flex flex-wrap items-center gap-1.5" id="shot-bar">
        <a href="/index.html" class="ctrl-btn px-2 py-1.5 rounded-md border border-[var(--border)] bg-[var(--secondary)] text-[var(--muted-foreground)] hover:text-white no-underline">← 通常版</a>
        <button data-shot="0" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">1. 大雪像・城</button>
        <button data-shot="1" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">2. 大通パレード</button>
        <button data-shot="2" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">3. テレビ塔</button>
        <button data-shot="3" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">4. すすきの氷像</button>
        <button data-shot="4" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">5. 赤れんが・駅</button>
        <button data-shot="5" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">6. 藻岩山</button>
        <button data-shot="6" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">7. 鉄道・地下鉄</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="btn-lod" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-sky-400/50 bg-sky-500/20 text-sky-200 font-medium">札幌全10区: LOD2</button>
        <button id="btn-rail" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-emerald-400/50 bg-emerald-500/20 text-emerald-200 font-medium">🚇 鉄道: ON</button>
        <button id="btn-map" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-amber-400/40 bg-amber-500/15 text-amber-200 font-medium">🗺 道路地図</button>
        <button id="btn-style" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">リアル質感</button>
        <button id="btn-proj" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)]">マッピング: ON</button>
        <div class="inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--card)] overflow-hidden" id="time-bar">
          <button data-time="0" class="ctrl-btn px-2 py-1.5 bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">夕方</button>
          <button data-time="1" class="ctrl-btn px-2 py-1.5 text-[var(--foreground)]">夜景</button>
          <button data-time="2" class="ctrl-btn px-2 py-1.5 text-[var(--foreground)]">昼</button>
          <button data-time="3" class="ctrl-btn px-2 py-1.5 text-[var(--foreground)]">朝</button>
        </div>
        <button id="btn-cam" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">シネマ自動</button>
      </div>
    </div>

    <!-- All 10 Sapporo Wards Quick-Jump + Current Location + Season & Weather Bar -->
    <div class="shrink-0 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-1" id="ward-bar">
        <button id="btn-loc" class="ctrl-btn px-2 py-1 rounded border border-emerald-400/50 bg-emerald-500/20 text-emerald-200 font-medium">📍 現在地</button>
        <span class="text-[var(--muted-foreground)] font-medium ml-1 mr-0.5">10区:</span>
        <button data-ward="chuo" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">中央</button>
        <button data-ward="kita" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">北</button>
        <button data-ward="higashi" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">東</button>
        <button data-ward="shiroishi" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">白石</button>
        <button data-ward="toyohira" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">豊平</button>
        <button data-ward="minami" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">南</button>
        <button data-ward="nishi" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">西</button>
        <button data-ward="atsubetsu" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">厚別</button>
        <button data-ward="teine" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">手稲</button>
        <button data-ward="kiyota" class="ctrl-btn px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">清田</button>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <div class="inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--card)] overflow-hidden" id="season-bar">
          <button data-season="spring" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">春</button>
          <button data-season="summer" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">夏</button>
          <button data-season="autumn" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">秋</button>
          <button data-season="winter" class="ctrl-btn px-2 py-1 bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">冬</button>
        </div>
        <div class="inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--card)] overflow-hidden" id="weather-bar">
          <button data-weather="clear" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">☀ 快晴</button>
          <button data-weather="cloudy" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">☁ 曇り</button>
          <button data-weather="rain" class="ctrl-btn px-2 py-1 text-[var(--foreground)]">🌧 雨</button>
          <button data-weather="snow" class="ctrl-btn px-2 py-1 bg-[var(--primary)] text-[var(--primary-foreground)] font-medium">❄ 雪</button>
        </div>
      </div>
    </div>

    <!-- Full-Height Three.js + PLATEAU 3D Tiles Cinema Viewport -->
    <div id="stage-wrap" class="relative flex-1 min-h-[380px] w-full rounded-xl overflow-hidden border border-[var(--card-border)] bg-black shadow-2xl">
      <!-- Slim Streaming Progress Indicator -->
      <div id="tile-progress-wrap" class="pointer-events-none absolute top-0 left-0 right-0 h-[3px] z-30 bg-transparent transition-opacity duration-300 opacity-0">
        <div id="tile-progress-bar" class="h-full bg-gradient-to-r from-sky-400 via-cyan-300 to-emerald-400 transition-[width] duration-200" style="width: 0%"></div>
      </div>
      <!-- CinemaScope Letterbox Bars -->
      <div id="bar-top" class="cinema-bar pointer-events-none absolute top-0 left-0 right-0 bg-black/95 h-5 z-10"></div>
      <div id="bar-bot" class="cinema-bar pointer-events-none absolute bottom-0 left-0 right-0 bg-black/95 h-5 z-10"></div>

      <!-- Subtle Cinema Title / PLATEAU Telemetry Overlay -->
      <div class="pointer-events-none absolute top-7 left-4 right-4 z-20 flex items-start justify-between gap-2 text-xs text-white/95 drop-shadow">
        <div>
          <div class="flex items-center gap-2">
            <span class="px-1.5 py-0.5 rounded bg-sky-500/80 text-[10px] font-bold tracking-wider text-slate-950">PLATEAU 3D</span>
            <span class="tracking-[0.2em] font-semibold text-sm" id="shot-title">PLATEAU SAPPORO · GRAND SNOW CASTLE</span>
          </div>
          <div class="text-white/75 text-xs mt-0.5" id="shot-sub">実寸PLATEAU大通4丁目 大雪像「白雪の大城郭」プロジェクションマッピング</div>
        </div>
        <div class="flex items-center gap-2 font-mono text-xs text-white/85">
          <span id="rec-badge" class="hidden items-center gap-1 px-2 py-0.5 rounded bg-red-600/90 text-white font-semibold">
            <span class="rec-dot inline-block w-1.5 h-1.5 rounded-full bg-white"></span>
            <span id="rec-timer">REC 00:00</span>
          </span>
          <span id="tile-readout" class="px-2 py-0.5 rounded bg-slate-900/75 border border-white/15">Tiles: 読込中...</span>
          <span id="fps-readout">60 FPS · PLATEAU</span>
        </div>
      </div>

      <!-- On-Screen Camera Control Pad (Press & Hold for Smooth Flight) -->
      <div id="cam-pad-wrap" class="absolute bottom-7 left-3 z-20 flex flex-col items-start gap-1 text-[11px]">
        <button id="btn-pad-toggle" class="ctrl-btn px-2 py-0.5 rounded bg-slate-900/80 border border-white/20 text-white/85 backdrop-blur-sm">🎮 カメラ操作</button>
        <div id="cam-pad" class="p-2 rounded-lg bg-slate-950/75 border border-white/15 backdrop-blur-md shadow-xl flex items-center gap-2.5 text-white">
          <!-- Pan / Move D-Pad -->
          <div class="grid grid-cols-3 gap-1">
            <span></span>
            <button data-cam-act="fwd" title="前進" class="ctrl-btn w-7 h-7 rounded bg-slate-800/90 border border-white/15 font-bold">↑</button>
            <span></span>
            <button data-cam-act="left" title="左へ移動" class="ctrl-btn w-7 h-7 rounded bg-slate-800/90 border border-white/15 font-bold">←</button>
            <button data-cam-act="reset" title="大通中央へ戻す" class="ctrl-btn w-7 h-7 rounded bg-sky-500/25 border border-sky-400/40 text-sky-200 text-[10px]">●</button>
            <button data-cam-act="right" title="右へ移動" class="ctrl-btn w-7 h-7 rounded bg-slate-800/90 border border-white/15 font-bold">→</button>
            <span></span>
            <button data-cam-act="back" title="後退" class="ctrl-btn w-7 h-7 rounded bg-slate-800/90 border border-white/15 font-bold">↓</button>
            <span></span>
          </div>
          <!-- Orbit Rotate & Tilt -->
          <div class="grid grid-cols-2 gap-1">
            <button data-cam-act="rotL" title="左回転" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">⟲ 左回</button>
            <button data-cam-act="rotR" title="右回転" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">⟳ 右回</button>
            <button data-cam-act="tiltUp" title="俯瞰（上から見る）" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">俯瞰</button>
            <button data-cam-act="tiltDown" title="見上げる" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">見上</button>
            <button data-cam-act="up" title="高度を上げる" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">▲ 上昇</button>
            <button data-cam-act="down" title="高度を下げる" class="ctrl-btn px-2 h-7 rounded bg-slate-800/90 border border-white/15">▼ 下降</button>
          </div>
          <!-- Zoom In / Out -->
          <div class="flex flex-col gap-1">
            <button data-cam-act="zoomIn" title="ズームイン" class="ctrl-btn w-8 h-10 rounded bg-sky-500/25 border border-sky-400/40 text-sky-100 font-bold text-sm">＋</button>
            <button data-cam-act="zoomOut" title="ズームアウト" class="ctrl-btn w-8 h-10 rounded bg-slate-800/90 border border-white/15 font-bold text-sm">−</button>
          </div>
        </div>
      </div>

      <!-- Floating Rail & Subway Legend / Filter / Quick-View Panel -->
      <div id="rail-panel-wrap" class="absolute bottom-12 right-3 z-20 flex flex-col items-end gap-1 text-[11px]">
        <button id="btn-rail-panel" class="ctrl-btn px-2 py-0.5 rounded bg-slate-900/80 border border-white/20 text-white/85 backdrop-blur-sm">🚆 地下鉄・JR 路線</button>
        <div id="rail-panel" class="p-2 rounded-lg bg-slate-950/80 border border-white/15 backdrop-blur-md shadow-xl flex flex-col gap-1.5 text-white min-w-[228px]">
          <div class="flex items-center justify-between gap-2 pb-1 border-b border-white/10">
            <span class="text-[10px] font-semibold tracking-wider text-slate-300">SAPPORO RAIL NETWORK</span>
            <button id="btn-rail-xray" class="ctrl-btn px-1.5 py-0.5 rounded border border-cyan-400/40 bg-cyan-500/15 text-cyan-200 text-[10px]">地下透視: OFF</button>
          </div>
          <div class="grid grid-cols-2 gap-1" id="rail-line-toggles">
            <button data-rail-line="namboku" class="ctrl-btn flex items-center gap-1.5 px-2 py-1 rounded border border-emerald-400/50 bg-emerald-500/20 text-emerald-100 text-left">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#00a854] shrink-0"></span>
              <span>南北線 <span class="text-[9px] opacity-75">16駅</span></span>
            </button>
            <button data-rail-line="tozai" class="ctrl-btn flex items-center gap-1.5 px-2 py-1 rounded border border-amber-400/50 bg-amber-500/20 text-amber-100 text-left">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#f39800] shrink-0"></span>
              <span>東西線 <span class="text-[9px] opacity-75">19駅</span></span>
            </button>
            <button data-rail-line="toho" class="ctrl-btn flex items-center gap-1.5 px-2 py-1 rounded border border-sky-400/50 bg-sky-500/20 text-sky-100 text-left">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#0088d6] shrink-0"></span>
              <span>東豊線 <span class="text-[9px] opacity-75">14駅</span></span>
            </button>
            <button data-rail-line="jr" class="ctrl-btn flex items-center gap-1.5 px-2 py-1 rounded border border-green-400/50 bg-green-500/20 text-green-100 text-left">
              <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#22b14c] shrink-0"></span>
              <span>JR北海道 <span class="text-[9px] opacity-75">3線</span></span>
            </button>
          </div>
          <div class="pt-1 border-t border-white/10">
            <div class="text-[9px] text-slate-400 mb-1">鉄道スポットへ移動:</div>
            <div class="grid grid-cols-2 gap-1" id="rail-view-btns">
              <button data-rail-view="jr-sapporo" class="ctrl-btn px-1.5 py-1 rounded bg-slate-800/90 border border-white/15 text-[10px]">JR札幌駅高架</button>
              <button data-rail-view="odori-hub" class="ctrl-btn px-1.5 py-1 rounded bg-slate-800/90 border border-white/15 text-[10px]">大通3線交差</button>
              <button data-rail-view="namboku-viaduct" class="ctrl-btn px-1.5 py-1 rounded bg-slate-800/90 border border-white/15 text-[10px]">南北線高架区間</button>
              <button data-rail-view="shin-sapporo" class="ctrl-btn px-1.5 py-1 rounded bg-slate-800/90 border border-white/15 text-[10px]">新さっぽろ</button>
            </div>
          </div>
        </div>
      </div>

      <!-- CC BY 4.0 Attribution Credit (Project PLATEAU + GSI Japan) -->
      <div class="pointer-events-none absolute bottom-6 right-4 z-20 text-[11px] text-white/65 bg-slate-950/55 px-2 py-0.5 rounded backdrop-blur-sm">
        出典：国土交通省 Project PLATEAU（札幌市全10区） / 地図・標高：国土地理院
      </div>

      <!-- Film Cut Fade Curtain -->
      <div id="cut-fade" class="pointer-events-none absolute inset-0 bg-black opacity-0 transition-opacity duration-200 z-10"></div>
    </div>

    <!-- Bottom Transport & Controls -->
    <div class="shrink-0 flex flex-wrap items-center justify-between gap-3 pt-0.5 text-xs text-[var(--muted-foreground)]">
      <div class="flex items-center gap-2.5 flex-1 min-w-[220px]">
        <button id="btn-play" class="ctrl-btn px-3 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium">一時停止</button>
        <input id="timeline" type="range" min="0" max="1000" value="0" class="flex-1 accent-[var(--primary)]" />
        <span id="timecode" class="font-mono tabular-nums text-[var(--foreground)] w-11 text-right">00:00</span>
      </div>
      <div class="flex items-center gap-2">
        <label class="flex items-center gap-1.5">
          <span id="lbl-precip">雪</span>
          <input id="sl-snow" type="range" min="0" max="100" value="68" class="w-20 accent-[var(--primary)]" />
        </label>
        <button id="btn-scope" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">2.39:1</button>
        <button id="btn-rec" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">録画</button>
        <button id="btn-fs" class="ctrl-btn px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]">全画面</button>
      </div>
    </div>
  </div>

  <!--__BUNDLE__-->
</body>
</html>
